# ============================================================
# PP422 DS Economic Frontier — Central Configuration
# ============================================================

# --- Paths ---
paths:
  raw_data: "data/raw_data"
  processed_data: "data/processed_data"
  output: "output"
  src: "src"
  notebooks: "notebooks"
  documentation: "documentation"

  # Raw data subfolders
  boundaries: "data/raw_data/boundaries"
  business_counts: "data/raw_data/business_counts"
  employee_counts: "data/raw_data/employee_counts"
  local_indicators: "data/raw_data/local_indicators"

  # Raw files
  business_counts_lad: "data/raw_data/business_counts/Business_counts_IS8_LADs.parquet"
  business_counts_msoa: "data/raw_data/business_counts/Business_counts_IS8_MSOAs.parquet"
  employee_counts_lad: "data/raw_data/employee_counts/Employee_counts_IS8_LADs.parquet"
  employee_counts_msoa: "data/raw_data/employee_counts/Employee_counts_IS8_MSOAs.parquet"
  sic_lookup: "data/raw_data/IS-8_SIC_Lookup.csv"
  ons_indicators: "data/raw_data/local_indicators/ONS_local_indicators_package.xlsx"

  # Boundary files
  lad_boundaries: "data/raw_data/boundaries/UK_Local_Authority_Districts_December_2023_Boundaries_UK_BGC_2537431731774104276.geojson"
  msoa_boundaries: "data/raw_data/boundaries/Middle_layer_Super_Output_Areas_December_2021_Boundaries_EW_BGC_V3_-4477917303172606123.geojson"
  iz_boundaries: "data/raw_data/boundaries/SG_IZ_2022.geojson"
  msoa_to_ca: "data/raw_data/boundaries/MSOA_to_English_combined_authorities.csv"
  iz_to_council: "data/raw_data/boundaries/IZ2022_to_council_area.csv"

  # University / HE presence
  hesa_campuses: "data/raw_data/facilities/hesa_campus_data.csv"
  ofs_register:  "data/raw_data/facilities/The_Office_for_Students_Register.xlsx"

  # Processed files
  analysis_panel: "data/processed_data/analysis_panel.parquet"
  analysis_panel_UK: "data/processed_data/analysis_panel_UK.parquet"

# --- Analysis parameters ---
parameters:
  # Year range available in data
  business_counts_years: [2016, 2025]
  employee_counts_years: [2015, 2024]

  # Boundary reconciliation approach:
  # 0 = no reconciliation (keep obsolete codes as-is)
  # 1 = drop obsolete LADs (default — acknowledge as limitation)
  # 2 = remap and aggregate (simple mean for rates, sum for counts)
  boundary_approach: 2

  # Geography filter:
  # true  = restrict to English LADs only (E prefix)
  # false = keep full GB panel (England + Scotland + Wales)
  england_only: true

  # Years to use for growth calculations (start and end)
  growth_start_year_emp: 2016
  growth_start_year_bus: 2016
  growth_end_year: 2023

  # Primary unit of analysis (confirmed in Step 4)
  primary_geography: "LAD"  # MSOA reserved for mapping only

  # Raw → standardised IS8 sector name mapping
  sector_map:
    "Advanced manufacturing":             "Advanced Manufacturing"
    "Creative Industries":                "Creative Industries"
    "Defence sector":                     "Defence"
    "Digital and Technology":             "Digital and Technologies"
    "Financial Services":                 "Financial Services"
    "Life Sciences":                      "Life Sciences"
    "Professional and Business Services": "Professional and Business Services"

  # IS8 sector names (standardised)
  is8_sectors:
    - "Advanced Manufacturing"
    - "Clean Energy Industries"
    - "Creative Industries"
    - "Defence"
    - "Digital and Technologies"
    - "Financial Services"
    - "Life Sciences"
    - "Professional and Business Services"

  # Candidate city regions for Phase 2
  candidate_regions:
    - "South Yorkshire MCA"
    - "West Midlands CA"
    - "West Yorkshire CA"
    - "Greater Manchester CA"
    - "West of England CA"
    - "Glasgow City Region"
    - "Cardiff-Newport"

  # ONS indicator column mapping
  # Maps derived sheet names (as they appear after parsing) to codebook variable names
  # Columns not listed here are excluded from the panel entirely
  # Excluded variables are documented in the codebook with reasons
  ons_column_map:
    # Human capital
    level_3+_qualifications:       nvq_level3
    gcse_by_age_19:                gcse_age19
    apprenticeship_starts:         apprenticeship_starts
    apprenticeship_achievements:   apprenticeship_achievements
    fe_and_skills_participation:   fe_participation
    # Entrepreneurial discovery
    new_enterprises:               enterprise_births
    deaths_of_enterprises:         enterprise_deaths
    active_enterprises:            enterprise_active
    high_growth_enterprises:       enterprise_high_growth
    # Connectivity and accessibility
    public_transport_to_employer:  transport_to_employer
    drive_to_employer:             drive_to_employer
    cycle_to_employer:             cycle_to_employer
    broadband_availability:        broadband
    4g_area_coverage:              coverage_4g
    # Labour market
    unemployment_rate:             unemployment_rate
    # Place conditions
    net_additions:                 housing_net_additions

  # South Yorkshire MCA constituent LADs
  sy_lad_codes:
    - "E08000016"  # Barnsley
    - "E08000017"  # Doncaster
    - "E08000018"  # Rotherham
    - "E08000019"  # Sheffield
  sy_lad_names:
    - "Barnsley"
    - "Doncaster"
    - "Rotherham"
    - "Sheffield"

  # EEG variable groupings for clustering and scorecard
  # Spearman correlation check (2023): removed drive_to_employer and cycle_to_employer
  # (r=0.97-0.98 with transport_to_employer) and apprenticeship_achievements
  # (r=0.93 with apprenticeship_starts)
  eeg_groups:
    Knowledge Base:
      - nvq_level3
      - gcse_age19
      - apprenticeship_starts
      - fe_participation
      - n_universities_feecap_lad
    Entrepreneurial Discovery:
      - enterprise_birth_rate
      - enterprise_death_rate
      - enterprise_high_growth_rate
    Connectivity and Agglomeration Potential:
      - transport_to_employer
      - broadband
    Labour Market Conditions:
      - unemployment_rate
    Place Attractiveness:
      - housing_net_additions